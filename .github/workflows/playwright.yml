name: IDA-6 Automation + Allure + Slack

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write


jobs:

  # ============================================================
  # IDA-6 AUTOMATION JOB
  # ============================================================

  test:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 🚀 SLACK - AUTOMATION STARTED
      # ========================================================

      - name: Slack - IDA-6 Automation Started
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          PAYLOAD=$(jq -n \
            --arg time "$IST_TIME" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            '{
              text:
                "🚀 *IDA-6 Automation Started*\n\nProject: IDA-6 Automation\nRepository: \($repository)\nBranch: \($branch)\nTriggered By: \($actor)\nTime: \($time)"
            }'
          )

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"


      # ========================================================
      # 📥 CHECKOUT CODE
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 🟢 SETUP NODE
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # ========================================================
      # 📦 INSTALL NPM DEPENDENCIES
      # ========================================================

      - name: Install Dependencies
        run: |

          echo "========================================"
          echo "Installing npm dependencies"
          echo "========================================"

          npm ci


      # ========================================================
      # 🎭 INSTALL PLAYWRIGHT CHROMIUM
      # ========================================================

      - name: Install Playwright Chromium
        run: |

          echo "========================================"
          echo "Installing Playwright Chromium"
          echo "========================================"

          npx playwright install --with-deps chromium


      # ========================================================
      # 🧪 RUN PLAYWRIGHT TESTS
      #
      # IMPORTANT:
      #
      # continue-on-error = true
      #
      # This allows the workflow to continue even if
      # some Playwright test cases fail.
      #
      # The final Slack message will still say:
      #
      # ✅ IDA-6 Automation Completed
      #
      # Failed test count will be shown separately.
      # ========================================================

      - name: Run IDA-6 Playwright Automation
        id: playwright
        continue-on-error: true
        run: |

          echo "========================================"
          echo "🚀 IDA-6 AUTOMATION STARTED"
          echo "========================================"

          echo "Project       : IDA-6 Automation"
          echo "Browser       : Chromium"
          echo "Branch        : ${{ github.ref_name }}"
          echo "Triggered By  : ${{ github.actor }}"

          echo "========================================"

          npx playwright test --project=chromium

          PLAYWRIGHT_EXIT_CODE=$?

          echo "========================================"
          echo "Playwright Exit Code: $PLAYWRIGHT_EXIT_CODE"
          echo "========================================"

          echo "exit_code=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $PLAYWRIGHT_EXIT_CODE


      # ========================================================
      # 📊 PARSE PLAYWRIGHT RESULTS
      #
      # Reads:
      #
      # results.json
      #
      # Generated by:
      #
      # ['json', { outputFile: 'results.json' }]
      #
      # from playwright.config.js
      # ========================================================

      - name: Parse Playwright Test Results
        id: results
        if: always()
        run: |

          echo "========================================"
          echo "📊 PARSING PLAYWRIGHT RESULTS"
          echo "========================================"


          if [ ! -f "results.json" ]; then

            echo "❌ results.json was not found."

            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "flaky=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            echo "total=0" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "✅ results.json found."


          node <<'NODE'

          const fs = require('fs');

          const outputFile = process.env.GITHUB_OUTPUT;

          try {

            const data = JSON.parse(
              fs.readFileSync('results.json', 'utf8')
            );


            const stats = data.stats || {};


            const passed =
              Number(stats.expected || 0);


            const failed =
              Number(stats.unexpected || 0);


            const flaky =
              Number(stats.flaky || 0);


            const skipped =
              Number(stats.skipped || 0);


            const total =
              passed +
              failed +
              flaky +
              skipped;


            console.log('');
            console.log('========================================');
            console.log('📊 IDA-6 AUTOMATION RESULTS');
            console.log('========================================');

            console.log(`✅ Passed  : ${passed}`);
            console.log(`❌ Failed  : ${failed}`);
            console.log(`⚠️ Flaky   : ${flaky}`);
            console.log(`⏭️ Skipped : ${skipped}`);
            console.log(`📊 Total   : ${total}`);

            console.log('========================================');
            console.log('');


            fs.appendFileSync(
              outputFile,
              `passed=${passed}\n`
            );


            fs.appendFileSync(
              outputFile,
              `failed=${failed}\n`
            );


            fs.appendFileSync(
              outputFile,
              `flaky=${flaky}\n`
            );


            fs.appendFileSync(
              outputFile,
              `skipped=${skipped}\n`
            );


            fs.appendFileSync(
              outputFile,
              `total=${total}\n`
            );


          } catch (error) {

            console.error(
              '❌ Error reading results.json'
            );

            console.error(error);


            fs.appendFileSync(
              outputFile,
              'passed=0\n'
            );

            fs.appendFileSync(
              outputFile,
              'failed=0\n'
            );

            fs.appendFileSync(
              outputFile,
              'flaky=0\n'
            );

            fs.appendFileSync(
              outputFile,
              'skipped=0\n'
            );

            fs.appendFileSync(
              outputFile,
              'total=0\n'
            );

          }

          NODE


      # ========================================================
      # 📝 GET COMMIT MESSAGE
      # ========================================================

      - name: Get Commit Information
        id: commit
        if: always()
        run: |

          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          COMMIT_SHA=$(git rev-parse HEAD)

          echo "========================================"
          echo "📝 COMMIT INFORMATION"
          echo "========================================"

          echo "Commit SHA:"
          echo "$COMMIT_SHA"

          echo ""

          echo "Commit Message:"
          echo "$COMMIT_MESSAGE"

          echo "========================================"


          {
            echo 'message<<EOF'
            echo "$COMMIT_MESSAGE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"


          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 🎥 UPLOAD FAILED VIDEOS
      # ========================================================

      - name: Upload Failed Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore


      # ========================================================
      # 🔍 UPLOAD PLAYWRIGHT TRACES
      # ========================================================

      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore


      # ========================================================
      # 📸 UPLOAD FAILURE SCREENSHOTS
      # ========================================================

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore


      # ========================================================
      # 📄 UPLOAD RESULTS.JSON
      # ========================================================

      - name: Upload Playwright Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: results.json
          if-no-files-found: ignore


      # ========================================================
      # 🕘 RESTORE ALLURE HISTORY
      # ========================================================

      - name: Restore Allure History
        if: always()
        run: |

          echo "========================================"
          echo "🕘 RESTORING ALLURE HISTORY"
          echo "========================================"


          rm -rf gh-pages


          git clone \
            --depth=1 \
            --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages || true


          if [ -d "gh-pages/history" ]; then

            echo "✅ Allure history found."

            mkdir -p allure-results/history

            cp -r gh-pages/history/* \
              allure-results/history/ || true

          else

            echo "ℹ️ No previous Allure history found."

          fi


      # ========================================================
      # 🌎 CREATE ALLURE ENVIRONMENT INFORMATION
      # ========================================================

      - name: Create Allure Environment Information
        if: always()
        run: |

          mkdir -p allure-results


          echo "Environment=DEV" \
            > allure-results/environment.properties


          echo "Project=IDA-6 Automation" \
            >> allure-results/environment.properties


          echo "Browser=Chromium" \
            >> allure-results/environment.properties


          echo "OS=Ubuntu Latest" \
            >> allure-results/environment.properties


          echo "Node=$(node -v)" \
            >> allure-results/environment.properties


          echo "Playwright=$(npx playwright --version)" \
            >> allure-results/environment.properties


          echo "Base URL=https://dev.intelehealth.org" \
            >> allure-results/environment.properties


      # ========================================================
      # ⚙️ CREATE ALLURE EXECUTOR INFORMATION
      # ========================================================

      - name: Create Allure Executor Information
        if: always()
        run: |

          mkdir -p allure-results


          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "IDA-6 Automation Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF


      # ========================================================
      # 📊 INSTALL ALLURE COMMAND LINE
      # ========================================================

      - name: Install Allure Commandline
        if: always()
        run: |

          npm install -g allure-commandline


      # ========================================================
      # 📊 GENERATE ALLURE REPORT
      # ========================================================

      - name: Generate Allure Report
        if: always()
        run: |

          echo "========================================"
          echo "📊 GENERATING ALLURE REPORT"
          echo "========================================"


          mkdir -p allure-results


          allure generate \
            allure-results \
            --clean \
            -o allure-report


          echo "========================================"
          echo "✅ ALLURE REPORT GENERATED"
          echo "========================================"


      # ========================================================
      # 🕘 PRESERVE ALLURE HISTORY
      # ========================================================

      - name: Preserve Allure History
        if: always()
        run: |

          mkdir -p allure-report/history


          if [ -d "allure-results/history" ]; then

            cp -r allure-results/history/* \
              allure-report/history/ || true

          fi


      # ========================================================
      # 📦 UPLOAD ALLURE RESULTS
      # ========================================================

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore


      # ========================================================
      # 📊 UPLOAD ALLURE REPORT
      # ========================================================

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore


      # ========================================================
      # 🌐 DEPLOY ALLURE REPORT TO GITHUB PAGES
      # ========================================================

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report


      # ========================================================
      # 🔗 CREATE REPORT URL
      # ========================================================

      - name: Create Allure Report URL
        id: report
        if: always()
        run: |

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"


          echo "url=$REPORT_URL" >> "$GITHUB_OUTPUT"


          echo ""
          echo "========================================"
          echo "📊 IDA-6 ALLURE REPORT"
          echo "========================================"
          echo "$REPORT_URL"
          echo "========================================"
          echo ""


      # ========================================================
      # 💬 SLACK - IDA-6 AUTOMATION COMPLETED
      #
      # IMPORTANT:
      #
      # This will ALWAYS show:
      #
      # ✅ IDA-6 Automation Completed
      #
      # Even when some test cases fail.
      #
      # The actual test results are shown below.
      # ========================================================

      - name: Slack - IDA-6 Automation Completed
        if: always()
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')


          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"


          GITHUB_LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"


          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"


          PAYLOAD=$(jq -n \
            --arg project "IDA-6 Automation" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg passed "${{ steps.results.outputs.passed }}" \
            --arg failed "${{ steps.results.outputs.failed }}" \
            --arg flaky "${{ steps.results.outputs.flaky }}" \
            --arg skipped "${{ steps.results.outputs.skipped }}" \
            --arg total "${{ steps.results.outputs.total }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg commit_message "${{ steps.commit.outputs.message }}" \
            --arg commit_url "$COMMIT_URL" \
            --arg execution_time "$IST_TIME" \
            --arg report_url "$REPORT_URL" \
            --arg github_logs "$GITHUB_LOG_URL" \
            '{
              blocks: [

                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "✅ IDA-6 Automation Completed"
                  }
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  fields: [

                    {
                      type: "mrkdwn",
                      text: "*Project:*\n\($project)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*Repository:*\n\($repository)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*Branch:*\n\($branch)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*Triggered By:*\n\($actor)"
                    }

                  ]
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "📊 *Automation Execution Summary*"
                  }
                },

                {
                  type: "section",
                  fields: [

                    {
                      type: "mrkdwn",
                      text: "*✅ Passed Tests:*\n\($passed)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*❌ Failed Tests:*\n\($failed)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*⚠️ Flaky Tests:*\n\($flaky)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*⏭️ Skipped Tests:*\n\($skipped)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*📊 Total Tests:*\n\($total)"
                    },

                    {
                      type: "mrkdwn",
                      text: "*🔢 Run Number:*\n#\($run_number)"
                    }

                  ]
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "📝 *Commit Message:*\n\($commit_message)"
                  }
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🔗 *Commit:*\n\($commit_url)"
                  }
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🕒 *Execution Time:*\n\($execution_time)"
                  }
                },

                {
                  type: "divider"
                },

                {
                  type: "actions",
                  elements: [

                    {
                      type: "button",
                      style: "primary",
                      text: {
                        type: "plain_text",
                        text: "📊 IDA-6 Automation Report"
                      },
                      url: $report_url
                    },

                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "📄 GitHub Logs"
                      },
                      url: $github_logs
                    }

                  ]
                }

              ]
            }'
          )


          echo "========================================"
          echo "📤 SENDING SLACK NOTIFICATION"
          echo "========================================"


          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"


          echo ""
          echo "========================================"
          echo "✅ IDA-6 AUTOMATION COMPLETED"
          echo "========================================"

          echo "Passed  : ${{ steps.results.outputs.passed }}"
          echo "Failed  : ${{ steps.results.outputs.failed }}"
          echo "Flaky   : ${{ steps.results.outputs.flaky }}"
          echo "Skipped : ${{ steps.results.outputs.skipped }}"
          echo "Total   : ${{ steps.results.outputs.total }}"

          echo "========================================"