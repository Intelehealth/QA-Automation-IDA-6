name: IDA-6 Automation + Dashboard + Allure + Slack

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: IDA-6 Automation
      ENVIRONMENT: DEV
      APP_BASE_URL: https://dev.intelehealth.org

    steps:

      # ========================================================
      # 🚀 SLACK - AUTOMATION STARTED
      # ========================================================

      - name: Slack - IDA-6 Automation Started
        run: |
          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          PAYLOAD=$(jq -n \
            --arg time "$IST_TIME" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            '{
              text:
                "🚀 *IDA-6 Automation Started*\n\nProject: IDA-6 Automation\nRepository: \($repository)\nBranch: \($branch)\nTriggered By: \($actor)\nTime: \($time)"
            }'
          )

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      # ========================================================
      # 📥 CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ========================================================
      # 🟢 SETUP NODE
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ========================================================
      # 🧪 RUN PLAYWRIGHT TESTS
      #
      # continue-on-error keeps the pipeline going when tests
      # fail, so the dashboard and Slack summary still publish.
      # ========================================================

      - name: Run IDA-6 Playwright Automation
        id: playwright
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          echo "========================================"
          echo "🚀 IDA-6 AUTOMATION STARTED"
          echo "========================================"
          echo "Project      : $PROJECT_NAME"
          echo "Browser      : Chromium"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Triggered By : ${{ github.actor }}"
          echo "========================================"

          PLAYWRIGHT_EXIT_CODE=0
          npx playwright test --project=chromium || PLAYWRIGHT_EXIT_CODE=$?

          echo "Playwright Exit Code: $PLAYWRIGHT_EXIT_CODE"
          echo "exit_code=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $PLAYWRIGHT_EXIT_CODE

      # ========================================================
      # 📝 COMMIT INFORMATION
      # ========================================================

      - name: Get Commit Information
        id: commit
        if: always()
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse HEAD)

          {
            echo 'message<<COMMIT_EOF'
            echo "$COMMIT_MESSAGE"
            echo 'COMMIT_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # ========================================================
      # 🕘 RESTORE PREVIOUS PUBLISHED SITE
      #
      # Pulls back two things from the gh-pages branch:
      #   1. Allure history  (allure/history)
      #   2. Dashboard run trend  (trend.json)
      # ========================================================

      - name: Restore Allure History and Dashboard Trend
        if: always()
        run: |
          rm -rf gh-pages

          git clone --depth=1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages || true

          mkdir -p allure-results

          if [ -d "gh-pages/allure/history" ]; then
            echo "✅ Allure history found."
            mkdir -p allure-results/history
            cp -r gh-pages/allure/history/* allure-results/history/ || true
          elif [ -d "gh-pages/history" ]; then
            echo "✅ Allure history found (legacy root layout)."
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true
          else
            echo "ℹ️ No previous Allure history."
          fi

          if [ -f "gh-pages/trend.json" ]; then
            echo "✅ Dashboard trend found."
            cp gh-pages/trend.json trend.json
          else
            echo "ℹ️ No previous dashboard trend — starting a new one."
          fi

      # ========================================================
      # 🌎 ALLURE ENVIRONMENT + EXECUTOR
      # ========================================================

      - name: Create Allure Environment Information
        if: always()
        run: |
          mkdir -p allure-results

          {
            echo "Environment=$ENVIRONMENT"
            echo "Project=$PROJECT_NAME"
            echo "Browser=Chromium"
            echo "OS=Ubuntu Latest"
            echo "Node=$(node -v)"
            echo "Playwright=$(npx playwright --version)"
            echo "Base URL=$APP_BASE_URL"
          } > allure-results/environment.properties

      - name: Create Allure Executor Information
        if: always()
        run: |
          mkdir -p allure-results

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "IDA-6 Automation Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/"
          }
          EOF

      # ========================================================
      # 📊 GENERATE ALLURE REPORT
      # ========================================================

      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p allure-results
          allure generate allure-results --clean -o allure-report

      - name: Preserve Allure History
        if: always()
        run: |
          mkdir -p allure-report/history
          if [ -d "allure-results/history" ]; then
            cp -r allure-results/history/* allure-report/history/ || true
          fi

      # ========================================================
      # 📈 BUILD THE DASHBOARD
      #
      # Produces:
      #   public/index.html          <- the dashboard
      #   public/dashboard-data.json <- raw parsed data
      #   public/trend.json          <- run history for the trend chart
      #   public/allure/             <- full Allure report
      # ========================================================

      - name: Build Automation Dashboard
        id: dashboard
        if: always()
        env:
          RESULTS_FILE: results.json
          OUT_DIR: public
          TREND_FILE: trend.json
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          ALLURE_URL: allure/
          BASE_URL: ${{ env.APP_BASE_URL }}
        run: |
          node .github/dashboard/generate-dashboard.js

          mkdir -p public/allure
          cp -r allure-report/* public/allure/ || true

          # Stops GitHub Pages from stripping folders that start with "_"
          touch public/.nojekyll

      # ========================================================
      # 📊 READ COUNTS FOR SLACK
      # ========================================================

      - name: Read Dashboard Summary
        id: results
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          let s = { passed:0, failed:0, flaky:0, skipped:0, total:0 };
          let modules = 'n/a';
          let rate = '0';

          try {
            const d = JSON.parse(fs.readFileSync('public/dashboard-data.json', 'utf8'));
            s = d.stats || s;
            const executed = (s.total || 0) - (s.skipped || 0);
            rate = executed > 0
              ? (((s.passed + s.flaky) / executed) * 100).toFixed(1)
              : '0';
            const failing = (d.modules || []).filter(m => m.failed > 0);
            modules = failing.length
              ? failing.map(m => `${m.name} (${m.failed})`).join(', ')
              : 'None — all modules green';
          } catch (e) {
            console.error('Could not read dashboard data:', e.message);
          }

          fs.appendFileSync(out, `passed=${s.passed}\n`);
          fs.appendFileSync(out, `failed=${s.failed}\n`);
          fs.appendFileSync(out, `flaky=${s.flaky}\n`);
          fs.appendFileSync(out, `skipped=${s.skipped}\n`);
          fs.appendFileSync(out, `total=${s.total}\n`);
          fs.appendFileSync(out, `rate=${rate}\n`);
          fs.appendFileSync(out, `failing_modules=${modules}\n`);

          console.log('Passed', s.passed, '| Failed', s.failed, '| Flaky', s.flaky,
                      '| Skipped', s.skipped, '| Total', s.total, '| Pass rate', rate + '%');
          NODE

      # ========================================================
      # 📦 ARTIFACTS
      # ========================================================

      - name: Upload Failed Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore

      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore

      - name: Upload Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: Upload Playwright Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: results.json
          if-no-files-found: ignore

      - name: Upload Dashboard Site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-dashboard
          path: public
          if-no-files-found: ignore

      # ========================================================
      # 🌐 DEPLOY (dashboard at /, Allure at /allure/)
      # ========================================================

      - name: Deploy Dashboard and Allure Report
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: false

      # ========================================================
      # 💬 SLACK - COMPLETED
      # ========================================================

      - name: Slack - IDA-6 Automation Completed
        if: always()
        run: |
          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          DASHBOARD_URL="$PAGES_URL/"
          ALLURE_URL="$PAGES_URL/allure/"
          FAILED_URL="$PAGES_URL/?status=unexpected"
          GITHUB_LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          FAILED_COUNT="${{ steps.results.outputs.failed }}"

          if [ "$FAILED_COUNT" = "0" ]; then
            HEADER="✅ IDA-6 Automation Completed"
          else
            HEADER="⚠️ IDA-6 Automation Completed with $FAILED_COUNT failed test(s)"
          fi

          PAYLOAD=$(jq -n \
            --arg header "$HEADER" \
            --arg project "$PROJECT_NAME" \
            --arg repository "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg passed "${{ steps.results.outputs.passed }}" \
            --arg failed "${{ steps.results.outputs.failed }}" \
            --arg flaky "${{ steps.results.outputs.flaky }}" \
            --arg skipped "${{ steps.results.outputs.skipped }}" \
            --arg total "${{ steps.results.outputs.total }}" \
            --arg rate "${{ steps.results.outputs.rate }}" \
            --arg failing_modules "${{ steps.results.outputs.failing_modules }}" \
            --arg run_number "${{ github.run_number }}" \
            --arg commit_message "${{ steps.commit.outputs.message }}" \
            --arg commit_url "$COMMIT_URL" \
            --arg execution_time "$IST_TIME" \
            --arg dashboard_url "$DASHBOARD_URL" \
            --arg failed_url "$FAILED_URL" \
            --arg allure_url "$ALLURE_URL" \
            --arg github_logs "$GITHUB_LOG_URL" \
            '{
              blocks: [
                { type: "header", text: { type: "plain_text", text: $header } },
                { type: "divider" },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*Project:*\n\($project)" },
                    { type: "mrkdwn", text: "*Repository:*\n\($repository)" },
                    { type: "mrkdwn", text: "*Branch:*\n\($branch)" },
                    { type: "mrkdwn", text: "*Triggered By:*\n\($actor)" }
                  ]
                },
                { type: "divider" },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "📊 *Execution Summary — \($rate)% pass rate*" }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*✅ Passed:*\n\($passed)" },
                    { type: "mrkdwn", text: "*❌ Failed:*\n\($failed)" },
                    { type: "mrkdwn", text: "*⚠️ Flaky:*\n\($flaky)" },
                    { type: "mrkdwn", text: "*⏭️ Skipped:*\n\($skipped)" },
                    { type: "mrkdwn", text: "*📊 Total:*\n\($total)" },
                    { type: "mrkdwn", text: "*🔢 Run:*\n#\($run_number)" }
                  ]
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "🧩 *Modules with failures:*\n\($failing_modules)" }
                },
                { type: "divider" },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "📝 *Commit:* <\($commit_url)|view>\n\($commit_message)" }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "🕒 *Execution Time:*\n\($execution_time)" }
                },
                { type: "divider" },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      style: "primary",
                      text: { type: "plain_text", text: "📊 Automation Dashboard" },
                      url: $dashboard_url
                    },
                    {
                      type: "button",
                      style: "danger",
                      text: { type: "plain_text", text: "❌ Failed Tests" },
                      url: $failed_url
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "🔍 Allure Report" },
                      url: $allure_url
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "📄 GitHub Logs" },
                      url: $github_logs
                    }
                  ]
                }
              ]
            }'
          )

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

          echo "Dashboard : $DASHBOARD_URL"
          echo "Allure    : $ALLURE_URL"