name: IDA-6 Automation + Dashboard + Allure + Slack

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write

# Only one deploy to gh-pages at a time, so two runs never fight over the branch.
concurrency:
  group: ida6-pages
  cancel-in-progress: false


jobs:

  # ============================================================
  # IDA-6 AUTOMATION JOB
  # ============================================================

  test:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 🚀 SLACK - AUTOMATION STARTED
      # ========================================================

      - name: Slack - IDA-6 Automation Started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          PAYLOAD=$(jq -n \
            --arg time "$IST_TIME" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            '{
              text:
                "🚀 *IDA-6 Automation Started*\n\nProject: IDA-6 Automation\nRepository: \($repository)\nBranch: \($branch)\nTriggered By: \($actor)\nTime: \($time)"
            }'
          )

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"


      # ========================================================
      # 📥 CHECKOUT CODE
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 🟢 SETUP NODE
      # ========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18


      # ========================================================
      # 📦 INSTALL NPM DEPENDENCIES
      # ========================================================

      - name: Install Dependencies
        run: |

          echo "========================================"
          echo "Installing npm dependencies"
          echo "========================================"

          npm ci


      # ========================================================
      # 🎭 INSTALL PLAYWRIGHT CHROMIUM
      # ========================================================

      - name: Install Playwright Chromium
        run: |

          echo "========================================"
          echo "Installing Playwright Chromium"
          echo "========================================"

          npx playwright install --with-deps chromium


      # ========================================================
      # 🧪 RUN PLAYWRIGHT TESTS
      #
      # continue-on-error keeps the workflow going when tests
      # fail, so the dashboard and Slack summary are still built.
      #
      # NOTE: the exit code is captured with "|| CODE=$?" because
      # the shell runs with -e and would otherwise abort the step
      # before the exit code was ever written.
      # ========================================================

      - name: Run IDA-6 Playwright Automation
        id: playwright
        continue-on-error: true
        run: |

          echo "========================================"
          echo "🚀 IDA-6 AUTOMATION STARTED"
          echo "========================================"

          echo "Project       : IDA-6 Automation"
          echo "Browser       : Chromium"
          echo "Branch        : ${{ github.ref_name }}"
          echo "Triggered By  : ${{ github.actor }}"

          echo "========================================"

          PLAYWRIGHT_EXIT_CODE=0

          npx playwright test --project=chromium || PLAYWRIGHT_EXIT_CODE=$?

          echo "========================================"
          echo "Playwright Exit Code: $PLAYWRIGHT_EXIT_CODE"
          echo "========================================"

          echo "exit_code=$PLAYWRIGHT_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit $PLAYWRIGHT_EXIT_CODE


      # ========================================================
      # 📝 GET COMMIT INFORMATION
      # ========================================================

      - name: Get Commit Information
        id: commit
        if: ${{ !cancelled() }}
        run: |

          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          COMMIT_SHA=$(git rev-parse HEAD)

          echo "========================================"
          echo "📝 COMMIT INFORMATION"
          echo "========================================"

          echo "$COMMIT_SHA"
          echo "$COMMIT_MESSAGE"

          echo "========================================"


          {
            echo 'message<<COMMIT_EOF'
            echo "$COMMIT_MESSAGE"
            echo 'COMMIT_EOF'
          } >> "$GITHUB_OUTPUT"


          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"


      # ========================================================
      # 🕘 RESTORE HISTORY FROM GH-PAGES
      #
      # Pulls two things out of the published site:
      #   gh-pages/allure/history  -> Allure trend graphs
      #   gh-pages/history.json    -> dashboard "Results per run"
      # ========================================================

      - name: Restore History From GitHub Pages
        if: ${{ !cancelled() }}
        run: |

          echo "========================================"
          echo "🕘 RESTORING HISTORY"
          echo "========================================"


          rm -rf gh-pages


          git clone \
            --depth=1 \
            --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages || true


          # ---- Allure history ----
          if [ -d "gh-pages/allure/history" ]; then

            echo "✅ Allure history found."
            mkdir -p allure-results/history
            cp -r gh-pages/allure/history/* allure-results/history/ || true

          elif [ -d "gh-pages/history" ]; then

            echo "✅ Allure history found (old layout)."
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true

          else

            echo "ℹ️ No previous Allure history found."

          fi


          # ---- Dashboard history ----
          if [ -f "gh-pages/history.json" ]; then

            echo "✅ Dashboard history found."
            cp gh-pages/history.json dashboard-history.json

          else

            echo "ℹ️ No previous dashboard history found."

          fi


      # ========================================================
      # 📈 BUILD IDA-6 TEST DASHBOARD
      #
      # Reads results.json and writes:
      #   dashboard/index.html
      #   dashboard/data.json
      #   dashboard/history.json
      # ========================================================

      - name: Build IDA-6 Dashboard
        id: dashboard
        if: ${{ !cancelled() }}
        env:
          RESULTS_FILE: results.json
          OUTPUT_DIR: dashboard
          HISTORY_FILE: dashboard-history.json
          HISTORY_LIMIT: 20
          PROJECT_NAME: IDA-6 Automation
          ENVIRONMENT: DEV
          BASE_URL: https://dev.intelehealth.org
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALLURE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/
        run: |

          echo "========================================"
          echo "📈 BUILDING IDA-6 DASHBOARD"
          echo "========================================"

          export RUN_TIME="$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"

          node .github/dashboard/build-dashboard.js


      # ========================================================
      # 📊 PARSE RESULTS FOR SLACK
      #
      # Reads dashboard/data.json, which the builder already
      # normalised, so Slack and the dashboard always agree.
      # ========================================================

      - name: Parse Test Results
        id: results
        if: ${{ !cancelled() }}
        run: |

          echo "========================================"
          echo "📊 PARSING TEST RESULTS"
          echo "========================================"


          if [ ! -f "dashboard/data.json" ]; then

            echo "❌ dashboard/data.json not found."

            {
              echo "passed=0"
              echo "failed=0"
              echo "flaky=0"
              echo "skipped=0"
              echo "total=0"
              echo "pass_rate=0"
              echo "modules=0"
              echo "failing_modules=Unknown"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          node <<'NODE'

          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('dashboard/data.json', 'utf8')
          );

          const t = data.totals || {};

          const modules = new Set(
            (data.tests || []).map(x => x.module)
          );

          const failing = (data.modules || [])
            .filter(m => m.failed > 0)
            .map(m => `${m.name} (${m.failed})`);

          const failingText = failing.length
            ? failing.join(', ')
            : 'None — all modules green';

          console.log('========================================');
          console.log('📊 IDA-6 AUTOMATION RESULTS');
          console.log('========================================');
          console.log(`✅ Passed    : ${t.passed || 0}`);
          console.log(`❌ Failed    : ${t.failed || 0}`);
          console.log(`⚠️ Flaky     : ${t.flaky || 0}`);
          console.log(`⏭️ Skipped   : ${t.skipped || 0}`);
          console.log(`📊 Total     : ${t.total || 0}`);
          console.log(`📈 Pass rate : ${t.passRate || 0}%`);
          console.log(`🧩 Modules   : ${modules.size}`);
          console.log(`🔴 Failing   : ${failingText}`);
          console.log('========================================');

          const out = [
            `passed=${t.passed || 0}`,
            `failed=${t.failed || 0}`,
            `flaky=${t.flaky || 0}`,
            `skipped=${t.skipped || 0}`,
            `total=${t.total || 0}`,
            `pass_rate=${t.passRate || 0}`,
            `modules=${modules.size}`,
            `failing_modules=${failingText}`
          ];

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            out.join('\n') + '\n'
          );

          NODE


      # ========================================================
      # 🌎 ALLURE ENVIRONMENT INFORMATION
      # ========================================================

      - name: Create Allure Environment Information
        if: ${{ !cancelled() }}
        run: |

          mkdir -p allure-results

          {
            echo "Environment=DEV"
            echo "Project=IDA-6 Automation"
            echo "Browser=Chromium"
            echo "OS=Ubuntu Latest"
            echo "Node=$(node -v)"
            echo "Playwright=$(npx playwright --version)"
            echo "Base URL=https://dev.intelehealth.org"
          } > allure-results/environment.properties


      # ========================================================
      # ⚙️ ALLURE EXECUTOR INFORMATION
      # ========================================================

      - name: Create Allure Executor Information
        if: ${{ !cancelled() }}
        run: |

          mkdir -p allure-results


          cat > allure-results/executor.json <<EXECUTOR_EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "IDA-6 Automation Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/"
          }
          EXECUTOR_EOF


      # ========================================================
      # 📊 INSTALL ALLURE COMMAND LINE
      # ========================================================

      - name: Install Allure Commandline
        if: ${{ !cancelled() }}
        run: npm install -g allure-commandline


      # ========================================================
      # 🧹 PRUNE HEAVY ALLURE ATTACHMENTS
      #
      # Allure embeds videos (.webm) and Playwright traces (.zip)
      # as attachments. On a 269-test run that pushes the report
      # past 2 GB, which breaks both the gh-pages push and the
      # 1 GB GitHub Pages limit.
      #
      # Videos and traces are still uploaded as build artifacts,
      # so nothing is lost -- they just aren't embedded in the
      # published report. Screenshots are kept.
      # ========================================================

      - name: Prune Heavy Allure Attachments
        if: ${{ !cancelled() }}
        run: |

          echo "========================================"
          echo "🧹 PRUNING ALLURE ATTACHMENTS"
          echo "========================================"

          if [ ! -d "allure-results" ]; then
            echo "ℹ️ No allure-results directory."
            exit 0
          fi

          echo "Before : $(du -sh allure-results | cut -f1)"

          # videos
          find allure-results -type f -name "*.webm" -delete || true

          # traces (Playwright trace zips)
          find allure-results -type f -name "*.zip" -delete || true

          # any single attachment over 5 MB
          find allure-results -type f -size +5M -delete || true

          echo "After  : $(du -sh allure-results | cut -f1)"

          echo "========================================"


      # ========================================================
      # 📊 GENERATE ALLURE REPORT
      # ========================================================

      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: |

          echo "========================================"
          echo "📊 GENERATING ALLURE REPORT"
          echo "========================================"


          mkdir -p allure-results

          allure generate allure-results --clean -o allure-report


          mkdir -p allure-report/history

          if [ -d "allure-results/history" ]; then
            cp -r allure-results/history/* allure-report/history/ || true
          fi


      # ========================================================
      # 🧩 ASSEMBLE THE PUBLISHED SITE
      #
      # public/
      #   index.html    -> IDA-6 dashboard (landing page)
      #   data.json     -> raw run data
      #   history.json  -> trend across runs
      #   allure/       -> full Allure report
      # ========================================================

      - name: Assemble GitHub Pages Site
        if: ${{ !cancelled() }}
        run: |

          rm -rf public
          mkdir -p public

          cp -r dashboard/. public/

          mkdir -p public/allure
          cp -r allure-report/. public/allure/

          # keeps GitHub Pages from running the files through Jekyll
          touch public/.nojekyll

          echo "========================================"
          echo "📁 SITE CONTENTS"
          echo "========================================"
          ls -la public

          SITE_SIZE=$(du -sm public | cut -f1)

          echo "Site size: ${SITE_SIZE} MB"

          if [ "$SITE_SIZE" -gt 900 ]; then
            echo "⚠️ WARNING: the site is over 900 MB."
            echo "GitHub Pages caps sites at 1 GB and the push will fail."
          fi

          echo "========================================"


      # ========================================================
      # 📦 UPLOAD ARTIFACTS
      # ========================================================

      - name: Upload Dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ida6-dashboard
          path: dashboard
          if-no-files-found: ignore

      - name: Upload Playwright Results JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: results.json
          if-no-files-found: ignore

      - name: Upload Failed Videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore

      - name: Upload Playwright Traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore

      - name: Upload Failure Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: Upload Allure Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: ignore


      # ========================================================
      # 🌐 DEPLOY DASHBOARD + ALLURE TO GITHUB PAGES
      #
      # Pull requests from forks cannot push to gh-pages,
      # so this only runs for pushes.
      # ========================================================

      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: false


      # ========================================================
      # 💬 SLACK - IDA-6 AUTOMATION COMPLETED
      # ========================================================

      - name: Slack - IDA-6 Automation Completed
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROJECT: IDA-6 Automation
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          PASSED: ${{ steps.results.outputs.passed }}
          FAILED: ${{ steps.results.outputs.failed }}
          FLAKY: ${{ steps.results.outputs.flaky }}
          SKIPPED: ${{ steps.results.outputs.skipped }}
          TOTAL: ${{ steps.results.outputs.total }}
          PASS_RATE: ${{ steps.results.outputs.pass_rate }}
          MODULES: ${{ steps.results.outputs.modules }}
          FAILING_MODULES: ${{ steps.results.outputs.failing_modules }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FAILED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?status=unexpected
          ALLURE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/
          GITHUB_LOG_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')


          # Header reflects the actual outcome instead of always saying "Completed".
          if [ "$FAILED" = "0" ]; then
            HEADER="✅ IDA-6 Automation Completed"
          else
            HEADER="⚠️ IDA-6 Automation Completed — $FAILED Failed"
          fi


          PAYLOAD=$(jq -n \
            --arg header "$HEADER" \
            --arg project "$PROJECT" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg flaky "$FLAKY" \
            --arg skipped "$SKIPPED" \
            --arg total "$TOTAL" \
            --arg pass_rate "$PASS_RATE" \
            --arg modules "$MODULES" \
            --arg failing_modules "$FAILING_MODULES" \
            --arg run_number "$RUN_NUMBER" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg execution_time "$IST_TIME" \
            --arg dashboard_url "$DASHBOARD_URL" \
            --arg failed_url "$FAILED_URL" \
            --arg allure_url "$ALLURE_URL" \
            --arg github_logs "$GITHUB_LOG_URL" \
            '{
              blocks: [

                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: $header
                  }
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*Project:*\n\($project)" },
                    { type: "mrkdwn", text: "*Repository:*\n\($repository)" },
                    { type: "mrkdwn", text: "*Branch:*\n\($branch)" },
                    { type: "mrkdwn", text: "*Triggered By:*\n\($actor)" }
                  ]
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "📊 *Automation Execution Summary*"
                  }
                },

                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*✅ Passed Tests:*\n\($passed)" },
                    { type: "mrkdwn", text: "*❌ Failed Tests:*\n\($failed)" },
                    { type: "mrkdwn", text: "*⚠️ Flaky Tests:*\n\($flaky)" },
                    { type: "mrkdwn", text: "*⏭️ Skipped Tests:*\n\($skipped)" },
                    { type: "mrkdwn", text: "*📊 Total Tests:*\n\($total)" },
                    { type: "mrkdwn", text: "*📈 Pass Rate:*\n\($pass_rate)%" },
                    { type: "mrkdwn", text: "*🧩 Modules Covered:*\n\($modules)" },
                    { type: "mrkdwn", text: "*🔢 Run Number:*\n#\($run_number)" }
                  ]
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🔴 *Modules With Failures:*\n\($failing_modules)"
                  }
                },

                {
                  type: "divider"
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "📝 *Commit Message:*\n\($commit_message)"
                  }
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🔗 *Commit:*\n\($commit_url)"
                  }
                },

                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "🕒 *Execution Time:*\n\($execution_time)"
                  }
                },

                {
                  type: "divider"
                },

                {
                  type: "actions",
                  elements: [

                    {
                      type: "button",
                      style: "primary",
                      text: { type: "plain_text", text: "📈 IDA-6 Dashboard" },
                      url: $dashboard_url
                    },

                    {
                      type: "button",
                      style: "danger",
                      text: { type: "plain_text", text: "❌ Failed Tests" },
                      url: $failed_url
                    },

                    {
                      type: "button",
                      text: { type: "plain_text", text: "📊 Allure Report" },
                      url: $allure_url
                    },

                    {
                      type: "button",
                      text: { type: "plain_text", text: "📄 GitHub Logs" },
                      url: $github_logs
                    }

                  ]
                }

              ]
            }'
          )


          echo "========================================"
          echo "📤 SENDING SLACK NOTIFICATION"
          echo "========================================"


          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"


          echo ""
          echo "========================================"
          echo "✅ IDA-6 AUTOMATION COMPLETED"
          echo "========================================"
          echo "Dashboard : $DASHBOARD_URL"
          echo "Allure    : $ALLURE_URL"
          echo "Passed    : $PASSED"
          echo "Failed    : $FAILED"
          echo "Flaky     : $FLAKY"
          echo "Skipped   : $SKIPPED"
          echo "Total     : $TOTAL"
          echo "Pass Rate : $PASS_RATE%"
          echo "========================================"