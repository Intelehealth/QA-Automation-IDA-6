name: IDA-6 Playwright Automation + Allure + Slack

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================================
  # IDA-6 AUTOMATION
  # =====================================================

  test:

    name: IDA-6 Automation Tests

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 🚀 SLACK START NOTIFICATION
      # =====================================================

      - name: Slack Start Notification
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          curl -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"blocks\": [

              {
                \"type\": \"header\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"🚀 IDA-6 Automation Started\"
                }
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"section\",
                \"fields\": [

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Project:*\nIDA-6 Automation\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Repository:*\n${{ github.repository }}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Branch:*\n${{ github.ref_name }}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Triggered By:*\n${{ github.actor }}\"
                  }

                ]
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*🕒 Start Time:*\n${IST_TIME}\"
                }
              }

            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}


      # =====================================================
      # CHECKOUT CODE
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE JS
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install Dependencies
        run: npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium


      # =====================================================
      # RUN PLAYWRIGHT TESTS
      # =====================================================

      - name: Run IDA-6 Playwright Tests
        id: playwright
        continue-on-error: true
        run: |

          npx playwright test \
            --project=chromium \
            --reporter=list,html,json,allure-playwright


      # =====================================================
      # UPLOAD PLAYWRIGHT HTML REPORT
      # =====================================================

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-playwright-html-report
          path: playwright-report/
          retention-days: 30


      # =====================================================
      # UPLOAD FAILED VIDEOS
      # =====================================================

      - name: Upload Failed Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-failed-videos
          path: test-results/**/*.webm
          if-no-files-found: ignore
          retention-days: 30


      # =====================================================
      # UPLOAD TRACES
      # =====================================================

      - name: Upload Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 30


      # =====================================================
      # UPLOAD SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 30


      # =====================================================
      # UPLOAD RESULTS.JSON
      # =====================================================

      - name: Upload Results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-results-json
          path: results.json
          if-no-files-found: ignore
          retention-days: 30


      # =====================================================
      # PARSE TEST RESULTS
      # =====================================================

      - name: Parse Test Results
        id: results
        if: always()
        run: |

          sudo apt-get update
          sudo apt-get install -y jq

          if [ -f results.json ]; then

            PASSED=$(jq '.stats.expected // 0' results.json)

            FAILED=$(jq '.stats.unexpected // 0' results.json)

            FLAKY=$(jq '.stats.flaky // 0' results.json)

            SKIPPED=$(jq '.stats.skipped // 0' results.json)

            TOTAL=$((PASSED + FAILED + FLAKY + SKIPPED))

          else

            PASSED=0
            FAILED=0
            FLAKY=0
            SKIPPED=0
            TOTAL=0

          fi

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          echo "flaky=$FLAKY" >> "$GITHUB_OUTPUT"

          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "IDA-6 AUTOMATION TEST RESULTS"
          echo "========================================"
          echo "Passed  : $PASSED"
          echo "Failed  : $FAILED"
          echo "Flaky   : $FLAKY"
          echo "Skipped : $SKIPPED"
          echo "Total   : $TOTAL"
          echo "========================================"


      # =====================================================
      # RESTORE ALLURE HISTORY
      # =====================================================

      - name: Restore Allure History
        if: always()
        run: |

          git clone \
            --depth=1 \
            --branch=gh-pages \
            https://github.com/${{ github.repository }} gh-pages \
            || true

          if [ -d "gh-pages/history" ]; then

            mkdir -p allure-results/history

            cp -r gh-pages/history/* allure-results/history/

          fi


      # =====================================================
      # CREATE ENVIRONMENT INFORMATION
      # =====================================================

      - name: Create Allure Environment
        if: always()
        run: |

          mkdir -p allure-results

          echo "Project=IDA-6 Automation" \
            > allure-results/environment.properties

          echo "Environment=DEV" \
            >> allure-results/environment.properties

          echo "Browser=Chromium" \
            >> allure-results/environment.properties

          echo "OS=Ubuntu Latest" \
            >> allure-results/environment.properties

          echo "Node=$(node -v)" \
            >> allure-results/environment.properties

          echo "Playwright=$(npx playwright --version)" \
            >> allure-results/environment.properties

          echo "Base URL=https://dev.intelehealth.org" \
            >> allure-results/environment.properties

          echo "Repository=${{ github.repository }}" \
            >> allure-results/environment.properties

          echo "Branch=${{ github.ref_name }}" \
            >> allure-results/environment.properties

          echo "Commit=${{ github.sha }}" \
            >> allure-results/environment.properties


      # =====================================================
      # CREATE ALLURE EXECUTOR INFORMATION
      # =====================================================

      - name: Create Allure Executor
        if: always()
        run: |

          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions - IDA-6 Automation",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": "${{ github.run_number }}",
            "buildName": "IDA-6 Automation Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF


      # =====================================================
      # INSTALL ALLURE
      # =====================================================

      - name: Install Allure Commandline
        if: always()
        run: |

          npm install -g allure-commandline


      # =====================================================
      # GENERATE ALLURE REPORT
      # =====================================================

      - name: Generate Allure Report
        if: always()
        run: |

          allure generate \
            allure-results \
            --clean \
            -o allure-report


      # =====================================================
      # PRESERVE ALLURE HISTORY
      # =====================================================

      - name: Preserve Allure History
        if: always()
        run: |

          mkdir -p allure-report/history

          if [ -d "allure-results/history" ]; then

            cp -r allure-results/history/* \
              allure-report/history/

          fi


      # =====================================================
      # UPLOAD ALLURE RESULTS
      # =====================================================

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-allure-results
          path: allure-results/
          retention-days: 30


      # =====================================================
      # UPLOAD ALLURE REPORT
      # =====================================================

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ida6-allure-report
          path: allure-report/
          retention-days: 30


      # =====================================================
      # DEPLOY ALLURE REPORT TO GITHUB PAGES
      # =====================================================

      - name: Deploy IDA-6 Allure Dashboard
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: false


      # =====================================================
      # CREATE REPORT URL
      # =====================================================

      - name: Display IDA-6 Dashboard URL
        if: always()
        run: |

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          echo "=============================================="
          echo "IDA-6 AUTOMATION DASHBOARD"
          echo "=============================================="
          echo "$REPORT_URL"
          echo "=============================================="


      # =====================================================
      # SLACK FINAL NOTIFICATION
      # =====================================================

      - name: Slack Final Notification
        if: always()
        run: |

          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')

          PASSED="${{ steps.results.outputs.passed }}"
          FAILED="${{ steps.results.outputs.failed }}"
          FLAKY="${{ steps.results.outputs.flaky }}"
          SKIPPED="${{ steps.results.outputs.skipped }}"
          TOTAL="${{ steps.results.outputs.total }}"

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"


          if [ "$FAILED" != "0" ]; then

            STATUS="❌ IDA-6 AUTOMATION FAILED"

          elif [ "$FLAKY" != "0" ]; then

            STATUS="⚠️ IDA-6 AUTOMATION PASSED WITH FLAKY TESTS"

          else

            STATUS="✅ IDA-6 AUTOMATION PASSED"

          fi


          curl -X POST \
          -H "Content-Type: application/json" \
          --data "{
            \"blocks\": [

              {
                \"type\": \"header\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"${STATUS}\"
                }
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"section\",
                \"fields\": [

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"* Project:*\nIDA-6 Automation\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"* Repository:*\n${{ github.repository }}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"* Branch:*\n${{ github.ref_name }}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"* Triggered By:*\n${{ github.actor }}\"
                  }

                ]
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"section\",
                \"fields\": [

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*✅ Passed*\n${PASSED}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*❌ Failed*\n${FAILED}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*⚠️ Flaky*\n${FLAKY}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*⏭️ Skipped*\n${SKIPPED}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*📊 Total*\n${TOTAL}\"
                  },

                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*🔢 Run Number:*\n#${{ github.run_number }}\"
                  }

                ]
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*📝 Commit:*\n<${COMMIT_URL}|View Commit>\"
                }
              },

              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*🕒 Execution Time:*\n${IST_TIME}\"
                }
              },

              {
                \"type\": \"divider\"
              },

              {
                \"type\": \"actions\",
                \"elements\": [

                  {
                    \"type\": \"button\",
                    \"style\": \"primary\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \"📊 View IDA-6 Dashboard\"
                    },
                    \"url\": \"${REPORT_URL}\"
                  },

                  {
                    \"type\": \"button\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \"📄 GitHub Logs\"
                    },
                    \"url\": \"${LOG_URL}\"
                  }

                ]
              }

            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

          echo "Slack final notification sent."


      # =====================================================
      # FAIL GITHUB ACTION IF TESTS FAILED
      # =====================================================

      - name: Fail Workflow If Tests Failed
        if: steps.playwright.outcome == 'failure'
        run: |

          echo "IDA-6 Automationtests failed."

          exit 1